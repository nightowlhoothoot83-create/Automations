name: Automation 6 Operations Checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: automation-6-operations
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test infrastructure
        run: node --test
      - name: Validate worker schedule without execution
        run: node src/orchestrate.mjs
      - name: Validate connection readiness without live calls
        run: node src/connections-cli.mjs
      - name: Validate schedules and retention dry-run
        run: node src/policy-cli.mjs
      - name: Enforce visual verification gate against blocked fixture
        run: node src/visual-gate-cli.mjs --matrix fixtures/visual/known-failure.json || test $? -eq 1
      - name: Run read-only checks
        run: node src/cli.mjs --config config/targets.example.json
      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-6-${{ github.run_id }}
          path: artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
