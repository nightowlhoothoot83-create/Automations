name: Deploy Ascension Management Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascension-management-hub-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MANAGEMENT_HUB }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete validation
        run: npm run check
      - name: Build Cloudflare Pages bundle
        run: npm run build:pages
      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy existing Pages project
        run: npx wrangler pages deploy src/hub/public --project-name=ascension-automation-hub --branch=codex/automation-5-management-hub
